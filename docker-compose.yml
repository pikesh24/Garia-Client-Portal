services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: garia
      POSTGRES_PASSWORD: garia
      POSTGRES_DB: garia_solutions
    ports:
      - "5432:5432"
    volumes:
      - garia_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garia -d garia_solutions"]
      interval: 2s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      # Inside the Docker network, containers reach each other by service name,
      # not localhost -- this overrides whatever DATABASE_URL is in backend/.env.
      DATABASE_URL: postgresql+psycopg://garia:garia@db:5432/garia_solutions
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8010:8000"
    volumes:
      - ./backend/uploads:/app/uploads

volumes:
  garia_postgres_data:
